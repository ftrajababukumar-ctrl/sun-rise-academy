<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Chhath Puja - Sun Rise Academy</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Yatra+One&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #0a0a2a, #ff7e5f, #feb47b);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Animated Sun */
        .sun {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #fff, #ffdf00, #ff8c00);
            border-radius: 50%;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 60px #ffdf00, 0 0 100px #ff8c00;
            animation: sunRise 10s ease-out forwards;
            z-index: 1;
        }

        @keyframes sunRise {
            0% { top: 70%; opacity: 0.5; box-shadow: 0 0 20px #ffdf00; }
            100% { top: 10%; opacity: 1; box-shadow: 0 0 80px #ffdf00, 0 0 150px #ff8c00; }
        }

        /* River/Water at the bottom */
        .river {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25vh;
            background: linear-gradient(to bottom, rgba(255, 140, 0, 0.4), #001f3f);
            z-index: 2;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        /* Main Content Box */
        .container {
            z-index: 3;
            text-align: center;
            margin-top: 25vh;
            padding: 20px;
            animation: fadeIn 3s ease-in;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Yatra One', cursive;
            font-size: 3.5rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            color: #fffbdd;
        }

        h2 {
            font-size: 2rem;
            color: #ffe600;
            text-shadow: 1px 1px 5px #000;
            margin-bottom: 30px;
        }

        /* Glassmorphism Cards */
        .card-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
        }

        .card h3 {
            font-size: 1.2rem;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .card p {
            font-size: 1rem;
            font-weight: 300;
        }

        /* Magic Button */
        .btn {
            background: linear-gradient(45deg, #ff4500, #ff8c00);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Yatra One', cursive;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.5);
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(255, 69, 0, 0.8);
        }

        /* Floating Diyas (Particles) */
        .diya {
            position: absolute;
            bottom: -20px;
            width: 15px;
            height: 15px;
            background: #ffdf00;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffdf00, 0 0 20px #ff4500;
            z-index: 3;
            animation: floatUp infinite ease-in;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 1.5rem; }
            .card-container { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <div class="sun"></div>

    <div class="container">
        <h1>शुभ महापर्व छठ पूजा</h1>
        <h2>SUN RISE ACADEMY</h2>

        <div class="card-container">
            <div class="card">
                <h3>Principal</h3>
                <p>Honorable Sonelal Sir</p>
            </div>
            <div class="card">
                <h3>Director</h3>
                <p>Honorable Balkishor Sir</p>
            </div>
        </div>

        <p style="margin-bottom: 20px; font-size: 1.1rem; max-width: 600px; margin-left: auto; margin-right: auto; text-shadow: 1px 1px 2px #000;">
            May the rising sun bring success, knowledge, and brightness to our school and everyone's life. 
            Praying to Chhathi Maiya for the prosperity of Sun Rise Academy!
        </p>

        <button class="btn" onclick="fireConfetti()">जय छठी मईया</button>
    </div>

    <div class="river" id="river"></div>

    <script>
        // Confetti Effect for Button
        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff8c00', '#ffd700', '#ff4500']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff8c00', '#ffd700', '#ff4500']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Generate Floating Diyas in the river
        function createDiyas() {
            const river = document.getElementById('river');
            for(let i = 0; i < 30; i++) {
                let diya = document.createElement('div');
                diya.classList.add('diya');
                diya.style.left = Math.random() * 100 + 'vw';
                diya.style.animationDuration = (Math.random() * 5 + 5) + 's';
                diya.style.animationDelay = (Math.random() * 5) + 's';
                river.appendChild(diya);
            }
        }

        // Initialize diyas
        window.onload = createDiyas;
    </script>
</body>
</html>
